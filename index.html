<script id="globira-review-remove-v5">
(function(){
  'use strict';

  /* Remove one exact cart row from the Review Your Order step. */
  window.removeCheckoutReviewItem=function(index){
    if(!Array.isArray(cart) || index<0 || index>=cart.length) return;

    cart.splice(index,1);

    try{
      if(typeof saveCart==='function') saveCart();
    }catch(e){}

    try{
      if(typeof renderReview==='function') renderReview();
      if(typeof renderCheckoutSummary==='function') renderCheckoutSummary();
      if(typeof renderCart==='function') renderCart();
    }catch(e){}

    if(!cart.length){
      try{ showToast('Your cart is now empty.'); }catch(e){}
    }else{
      try{ showToast('Product removed from your order review.'); }catch(e){}
    }
  };

  /* Rebuild the review renderer with a Remove button while preserving
     the existing product/variant/quantity/price information. */
  const originalRenderReview=window.renderReview;
  if(typeof originalRenderReview==='function' && !originalRenderReview.__globiraReviewRemoveV5){
    window.renderReview=function(){
      const container=document.getElementById('checkoutReview');
      if(!container){ return originalRenderReview.apply(this,arguments); }

      container.innerHTML=(Array.isArray(cart)?cart:[]).map(function(item,index){
        const product=typeof findProduct==='function'?findProduct(item.id):null;
        if(!product) return '';
        const image=(product.images&&product.images[0])||product.image||'';
        const safeName=String(product.name||'Product').replace(/"/g,'&quot;');
        const size=String(item.size||'Standard').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        return `
          <div class="review-card">
            <img src="${image}" alt="${safeName}">
            <div class="review-card-info">
              <h3>${product.name||'Product'}</h3>
              <div class="review-meta">
                Size: ${size}<br>
                Quantity: ${item.quantity}
              </div>
              <div class="review-price">${formatPrice(product.price*item.quantity)}</div>
              <button type="button" class="review-remove" onclick="removeCheckoutReviewItem(${index})">REMOVE</button>
            </div>
          </div>
        `;
      }).join('');

      const total=typeof getCartTotal==='function'?getCartTotal():0;
      container.innerHTML+=`
        <div class="review-total">
          <strong>Total</strong>
          <strong>${formatPrice(total)}</strong>
        </div>
      `;
    };
    window.renderReview.__globiraReviewRemoveV5=true;
  }
})();
</script>
